name: Deploy Static Website

on:
  push:
    branches:
      - develop
      - staging
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}

    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set environment name
        id: env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::473208108378:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: envs/${{ steps.env.outputs.env }}
        run: |
          terraform init \
            -backend-config="key=s3-static-website/${{ steps.env.outputs.env }}/terraform.tfstate"

      - name: Terraform Plan
        working-directory: envs/${{ steps.env.outputs.env }}
        run: |
          terraform plan \
            -var-file=${{ steps.env.outputs.env }}.tfvars

      - name: Terraform Apply
        working-directory: envs/${{ steps.env.outputs.env }}
        run: |
          terraform apply -auto-approve \
            -var-file=${{ steps.env.outputs.env }}.tfvars

      - name: Upload website content to S3
        working-directory: website-content
        run: |
          BUCKET=$(terraform -chdir=../envs/${{ steps.env.outputs.env }} output -raw s3_bucket_name)
          aws s3 sync . s3://$BUCKET --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(terraform -chdir=envs/${{ steps.env.outputs.env }} output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation \
            --distribution-id $DIST_ID \
            --paths "/*"
